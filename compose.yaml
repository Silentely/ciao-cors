services:
  ciao-cors:
    build:
      context: .
      dockerfile: Dockerfile
    image: ciao-cors:latest
    container_name: ciao-cors
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - RESOURCE_PROFILE=${RESOURCE_PROFILE:-standard}
      # - PROXY_API_KEY=${PROXY_API_KEY:-}
      # - API_KEY=${API_KEY:-}
      # - REQUIRE_HEADERS=true
      # - ENABLE_STATS=true
      # - ENABLE_CACHE=true
      # - MAX_CACHE_BYTES=33554432
      # - MAX_CACHE_ENTRIES=1000
    healthcheck:
      test: ["CMD", "deno", "eval", "const p=Deno.env.get('PORT')||'3000';const r=await fetch('http://127.0.0.1:'+p+'/health');if(!r.ok)Deno.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
